services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/wallet
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    profiles: [ "test" ]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/wallet
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/wallet_test
    depends_on:
      db:
        condition: service_healthy
    command: pytest -v

volumes:
  pgdata: